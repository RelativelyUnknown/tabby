[project]
name = "onrepeat"
version = "0.1.0"
description = "Spotify Wrapped, whenever you want: top artists, songs and hours from your Spotify export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
onrepeat = "onrepeat.cli:main"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# Python code lives in src/onrepeat, Rust in rust/. The compiled module is
# importable as onrepeat._songmatch.
python-source = "src"
module-name = "onrepeat._songmatch"
features = ["python"]

[tool.uv]
# Rebuild the Rust extension when any of these change.
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "rust/**/*.rs" }]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
# E/F = basic errors, I = import sorting, B = common bugs, UP = modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/onrepeat/share.py" = ["E501"]  # embedded HTML template
