[package]
name = "songmatch"
version = "0.1.0"
edition = "2024"
description = "Decides when two plays are the same song (across versions and services)."

[lib]
name = "_songmatch"
path = "rust/lib.rs"
# cdylib = the Python extension module, rlib = lets `cargo test` link the tests.
crate-type = ["cdylib", "rlib"]

[features]
# Python bindings are optional so `cargo test` is plain Rust. maturin turns this on.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30", optional = true }
unicode-normalization = "0.1"
