[package]
name = "songkey"
version = "0.1.0"
edition = "2021"
description = "Decides when two track listings are the same song (onrepeat)"

[lib]
name = "_songkey"
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# The Python glue is optional so `cargo test` can run without linking Python.
# maturin turns it on (see pyproject.toml).
python = ["dep:pyo3"]

[dependencies]
regex = "1"
unicode-normalization = "0.1"
pyo3 = { version = "0.30", features = ["abi3-py310"], optional = true }
