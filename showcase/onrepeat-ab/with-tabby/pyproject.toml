[project]
name = "onrepeat"
version = "0.1.0"
description = "Make a Wrapped for any year from your own Spotify export"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
onrepeat = "onrepeat.wrapped:main"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "onrepeat._core"
python-source = "."
include = ["onrepeat/**"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
