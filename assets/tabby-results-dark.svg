<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" role="img" aria-labelledby="t d">
<title id="t">Measured effect</title><desc id="d">Mean score 0.812 without Tabby and 0.902 with it over 112 cases.</desc>
<style>
  .blink { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
  .ear { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 9s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }
  @keyframes flick { 0%, 90%, 100% { transform: rotate(0); } 93% { transform: rotate(-7deg); } 96% { transform: rotate(2deg); } }
  @media (prefers-reduced-motion: reduce) { .blink, .ear { animation: none; } }
</style>
<rect width="760" height="358" rx="22" fill="#241c14" stroke="#3a2d20" stroke-width="2"/>
<text x="36" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#f4e9da">Measured effect</text>
<text x="36" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#a8978a">112 cases, 3 runs each, Claude Haiku 5.5, the same agent with and without Tabby</text>
<text x="36" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#a8978a">Without</text>
<rect x="130" y="106" width="520" height="26" rx="13" fill="#3a2d20"/><rect x="130" y="106" width="422" height="26" rx="13" fill="#6a5a4a"/>
<text x="664" y="125" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#f4e9da">0.812</text>
<text x="36" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#a8978a">With Tabby</text>
<rect x="130" y="150" width="520" height="26" rx="13" fill="#3a2d20"/><rect x="130" y="150" width="469" height="26" rx="13" fill="#e8903a"/>
<text x="664" y="169" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#f4e9da">0.902</text>
<text x="36" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#2a8f89">+0.090</text>
<text x="36" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a8978a">mean score, all cases</text>
<text x="250" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#e8903a">+0.141</text>
<text x="250" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a8978a">on the cases where it scores under 0.95 without</text>
<text x="36" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a8978a">Change per case of 0.10 or more</text>
<rect x="36" y="300" width="688" height="16" rx="8" fill="#3a2d20"/>
<rect x="36" y="300" width="209" height="16" rx="8" fill="#2a8f89"/>
<rect x="687" y="300" width="37" height="16" rx="8" fill="#d6564a"/>
<text x="36" y="338" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#f4e9da"><tspan fill="#2a8f89" font-weight="700">34 better</tspan>   ·   <tspan fill="#a8978a">72 about the same</tspan>   ·   <tspan fill="#d6564a" font-weight="700">6 worse</tspan></text>
</svg>
