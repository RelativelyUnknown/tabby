<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" width="760" height="358" role="img" aria-labelledby="t d">
<title id="t">Measured effect</title><desc id="d">Mean score 0.812 without Tabby and 0.902 with it over 112 cases.</desc>
<rect width="760" height="358" rx="22" fill="#1a1524" stroke="#2e2640" stroke-width="2"/>
<text x="36" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" fill="#efe8fb">Measured effect</text>
<text x="36" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#a99fbd">112 cases, 3 runs each, Claude Haiku 5.5, the same agent with and without Tabby</text>
<text x="36" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#a99fbd">Without</text>
<rect x="130" y="106" width="520" height="26" rx="13" fill="#2e2640"/><rect x="130" y="106" width="422" height="26" rx="13" fill="#5e5378"/>
<text x="664" y="125" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#efe8fb">0.812</text>
<text x="36" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#a99fbd">With Tabby</text>
<rect x="130" y="150" width="520" height="26" rx="13" fill="#2e2640"/><rect x="130" y="150" width="469" height="26" rx="13" fill="#e78fb7"/>
<text x="664" y="169" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#efe8fb">0.902</text>
<text x="36" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#7c5cd6">+0.090</text>
<text x="36" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a99fbd">mean score, all cases</text>
<text x="250" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="44" font-weight="800" fill="#e78fb7">+0.141</text>
<text x="250" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a99fbd">on the cases where it scores under 0.95 without</text>
<text x="36" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a99fbd">Change per case of 0.10 or more</text>
<rect x="36" y="300" width="688" height="16" rx="8" fill="#2e2640"/>
<rect x="36" y="300" width="209" height="16" rx="8" fill="#7c5cd6"/>
<rect x="687" y="300" width="37" height="16" rx="8" fill="#d6564a"/>
<text x="36" y="338" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#efe8fb"><tspan fill="#7c5cd6" font-weight="700">34 better</tspan>   ·   <tspan fill="#a99fbd">72 about the same</tspan>   ·   <tspan fill="#d6564a" font-weight="700">6 worse</tspan></text>
</svg>
